services:
  postgres:
    image: postgres:13-alpine
    container_name: vaadin-users-postgres
    environment:
      POSTGRES_DB: vaadin_users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vaadin_users"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: vaadin-users-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vaadin_users
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
    ports:
      - "8080:8080"

volumes:
  postgres_data: